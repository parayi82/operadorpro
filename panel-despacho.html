<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Despacho — ClickLaboral</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/fleet.css">
  <meta name="theme-color" content="#05603A">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <style>
    .despacho-header {
      background: var(--verde);
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .despacho-header .info { display: flex; flex-direction: column; }
    .despacho-header .info h1 { font-size: 20px; font-weight: 700; margin: 0; }
    .despacho-header .info span { font-size: 13px; color: #c8e6c9; margin-top: 2px; }
    .despacho-body { max-width: 820px; margin: 0 auto; padding: 28px 16px; }
    .despacho-intro { color: var(--gris-texto); margin-bottom: 22px; }
    .btn-agregar {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--verde); color: #fff;
      border: none; border-radius: 8px;
      padding: 10px 20px; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-bottom: 22px;
    }
    .btn-agregar:hover { opacity: .88; }
    .agregar-form {
      background: #fff; border: 1px solid #e0e0e0;
      border-radius: 10px; padding: 20px 22px; margin-bottom: 24px;
    }
    .agregar-form h3 { margin: 0 0 14px; font-size: 16px; }
    .agregar-form .fields { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .agregar-form .fields input {
      flex: 1 1 180px; padding: 10px 12px;
      border: 1px solid #ccc; border-radius: 7px; font-size: 15px;
    }
    .agregar-form .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn-confirm {
      background: var(--verde); color: #fff;
      border: none; border-radius: 7px; padding: 10px 20px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn-confirm:disabled { opacity: .6; cursor: default; }
    .btn-cancel {
      background: transparent; color: var(--asfalto);
      border: 1.5px solid #bbb; border-radius: 7px; padding: 9px 18px;
      font-size: 15px; cursor: pointer;
    }
    .clientes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .cliente-card {
      background: #fff; border: 1px solid #e0e0e0;
      border-radius: 10px; padding: 18px 20px;
    }
    .cliente-card h3 { margin: 0 0 4px; font-size: 17px; color: var(--asfalto); }
    .cliente-card .rfc { font-size: 13px; color: var(--gris-texto); margin: 0 0 14px; }
    .cliente-stats { display: flex; gap: 20px; margin-bottom: 14px; }
    .cliente-stats .stat { display: flex; flex-direction: column; }
    .cliente-stats .stat .n { font-size: 22px; font-weight: 700; color: var(--asfalto); }
    .cliente-stats .stat .l { font-size: 12px; color: var(--gris-texto); }
    .sin-registros { font-size: 12px; color: #e67e22; margin-bottom: 12px; }
    .cliente-actions { display: flex; gap: 10px; align-items: center; }
    .btn-dashboard {
      flex: 1; background: var(--asfalto); color: #fff;
      border: none; border-radius: 7px; padding: 9px 14px;
      font-size: 14px; font-weight: 600; cursor: pointer; text-align: center;
    }
    .btn-quitar {
      background: transparent; color: #c0392b;
      border: 1.5px solid #c0392b; border-radius: 7px; padding: 8px 12px;
      font-size: 14px; cursor: pointer; white-space: nowrap;
    }
    .btn-quitar:hover { background: #fdf0f0; }
    .empty-state {
      text-align: center; padding: 50px 0; color: var(--gris-texto);
    }
    .cerrar-sesion {
      background: transparent; color: #c8e6c9;
      border: 1.5px solid #c8e6c9; border-radius: 7px;
      padding: 7px 14px; font-size: 14px; cursor: pointer;
    }
    .cerrar-sesion:hover { background: rgba(255,255,255,.1); }
  </style>
</head>
<body style="background:#f5f6f4;min-height:100vh">

<div id="root">
  <p style="text-align:center;padding:60px 0;color:#888">Cargando…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
(function () {
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const API = (name) => `/api/${name}`;

  let session = null;
  let cartera = [];
  let showForm = false;

  // ---------- API helpers ----------
  async function apiFetch(name, { method = "GET", body } = {}) {
    const token = session?.access_token;
    const res = await fetch(API(name), {
      method,
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {})
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.error?.message || "Error de red");
    return data;
  }

  // ---------- Load cartera ----------
  async function loadCartera() {
    const { clientes } = await apiFetch("despacho-cartera");
    cartera = clientes || [];
  }

  // ---------- Render ----------
  function render() {
    if (!session) {
      renderLogin();
      return;
    }
    renderPanel();
  }

  function renderLogin() {
    document.getElementById("root").innerHTML = `
      <div style="max-width:380px;margin:80px auto;background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)">
        <h2 style="text-align:center;margin-bottom:22px;color:#05603A">Panel Despacho</h2>
        <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:600">Correo electrónico</label>
        <input id="li-email" type="email" placeholder="tucorreo@ejemplo.com"
          style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ccc;border-radius:7px;font-size:15px;margin-bottom:12px">
        <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:600">Contraseña</label>
        <input id="li-pass" type="password" placeholder="••••••••"
          style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ccc;border-radius:7px;font-size:15px;margin-bottom:16px">
        <div id="li-msg" style="min-height:20px;font-size:14px;color:#c0392b;margin-bottom:10px"></div>
        <button id="li-btn" class="btn-confirm" style="width:100%">Entrar</button>
      </div>`;

    document.getElementById("li-btn").onclick = async () => {
      const msg = document.getElementById("li-msg");
      msg.textContent = "Verificando…"; msg.style.color = "#666";
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById("li-email").value.trim(),
        password: document.getElementById("li-pass").value
      });
      if (error) { msg.textContent = "Correo o contraseña incorrectos."; msg.style.color = "#c0392b"; }
    };
  }

  function renderPanel() {
    const userLabel = session.user.email?.split("@")[0] || "usuario";
    const totalClientes = cartera.length;

    document.getElementById("root").innerHTML = `
      <div class="despacho-header">
        <div class="info">
          <h1>${esc(userLabel)}</h1>
          <span>Gestión de cartera · ${totalClientes} cliente${totalClientes !== 1 ? "(s)" : ""}</span>
        </div>
        <button class="cerrar-sesion" id="btn-logout">Cerrar sesión</button>
      </div>

      <div class="despacho-body">
        <p class="despacho-intro">Seleccione un cliente para gestionar sus expedientes, asistencias y documentos.
          Los datos de cada cliente están completamente separados.</p>

        ${showForm ? renderForm() : `<button class="btn-agregar" id="btn-show-form">+ Agregar cliente</button>`}

        <div id="panel-msg"></div>

        ${totalClientes === 0 && !showForm
          ? `<div class="empty-state"><p>Aún no tienes clientes en tu cartera.<br>Usa el botón de arriba para agregar el primero.</p></div>`
          : `<div class="clientes-grid">${cartera.map(renderCard).join("")}</div>`}
      </div>`;

    document.getElementById("btn-logout")?.addEventListener("click", async () => {
      await sb.auth.signOut();
    });

    if (showForm) {
      document.getElementById("btn-confirm-agregar").onclick = submitAgregar;
      document.getElementById("btn-cancelar").onclick = () => { showForm = false; render(); };
    } else {
      document.getElementById("btn-show-form")?.addEventListener("click", () => { showForm = true; render(); });
    }

    document.querySelectorAll("[data-quitar]").forEach((btn) => {
      btn.addEventListener("click", () => quitarCliente(btn.dataset.quitar));
    });
  }

  function renderForm() {
    return `
      <div class="agregar-form">
        <h3>Nuevo cliente en su cartera</h3>
        <div class="fields">
          <input id="f-nombre" type="text" placeholder="Nombre o razón social">
          <input id="f-rfc" type="text" placeholder="RFC" maxlength="13" style="text-transform:uppercase;max-width:200px">
        </div>
        <div class="actions">
          <button class="btn-confirm" id="btn-confirm-agregar">Agregar a mi cartera</button>
          <button class="btn-cancel" id="btn-cancelar">Cancelar</button>
          <span id="form-msg" style="font-size:14px;color:#c0392b"></span>
        </div>
        <p style="margin-top:12px;font-size:13px;color:var(--gris-texto)">
          Después de agregarlo, entre a "Gestionar cliente" para dar de alta a sus trabajadores.
          Si el RFC ya tiene información en la plataforma, la vinculación debe hacerla su asesor.
        </p>
      </div>`;
  }

  function renderCard(c) {
    return `
      <div class="cliente-card">
        <h3>${esc(c.client_nombre)}</h3>
        <p class="rfc">${esc(c.client_rfc)}</p>
        <div class="cliente-stats">
          <div class="stat"><span class="n">0</span><span class="l">Trabajadores</span></div>
          <div class="stat"><span class="n">0</span><span class="l">Asistencias/mes</span></div>
          <div class="stat"><span class="n">0</span><span class="l">Documentos</span></div>
        </div>
        <p class="sin-registros">Sin registros este mes</p>
        <div class="cliente-actions">
          <button class="btn-dashboard">Entrar al dashboard →</button>
          <button class="btn-quitar" data-quitar="${esc(c.client_rfc)}">✕ Quitar</button>
        </div>
      </div>`;
  }

  async function submitAgregar() {
    const btn = document.getElementById("btn-confirm-agregar");
    const msg = document.getElementById("form-msg");
    const nombre = document.getElementById("f-nombre").value.trim();
    const rfc = document.getElementById("f-rfc").value.trim().toUpperCase();

    if (!nombre) { msg.textContent = "Ingresa el nombre del cliente."; return; }
    if (!rfc || rfc.length < 3) { msg.textContent = "Ingresa un RFC válido."; return; }

    btn.disabled = true;
    btn.textContent = "Agregando…";
    msg.textContent = "";

    try {
      await apiFetch("despacho-cartera", {
        method: "POST",
        body: { client_nombre: nombre, client_rfc: rfc }
      });
      showForm = false;
      await loadCartera();
      render();
    } catch (e) {
      msg.textContent = "No se pudo agregar: " + (e.message || "Error al agregar cliente.");
      btn.disabled = false;
      btn.textContent = "Agregar a mi cartera";
    }
  }

  async function quitarCliente(rfc) {
    if (!confirm(`¿Seguro que deseas quitar al cliente con RFC ${rfc} de tu cartera?`)) return;
    try {
      await apiFetch("despacho-cartera", {
        method: "DELETE",
        body: { client_rfc: rfc }
      });
      await loadCartera();
      render();
    } catch (e) {
      alert("No se pudo quitar el cliente: " + (e.message || "Error."));
    }
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- Boot ----------
  sb.auth.onAuthStateChange(async (_event, s) => {
    session = s;
    if (session) {
      try { await loadCartera(); } catch (e) { console.error("loadCartera:", e); }
    } else {
      cartera = [];
    }
    render();
  });

  (async () => {
    const { data } = await sb.auth.getSession();
    session = data.session || null;
    if (session) {
      try { await loadCartera(); } catch (e) { console.error("loadCartera:", e); }
    }
    render();
  })();
})();
</script>
</body>
</html>
