<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar certificado — OperadorPro</title>
  <meta name="description" content="Verifica la autenticidad y vigencia de un certificado OperadorPro con su folio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="container">
    <a class="logo" href="index.html"><span class="chip">OP</span> OperadorPro</a>
    <nav><a href="index.html">Inicio</a><a href="app.html">Entrar</a></nav>
  </div>
</header>

<div class="verify-box">
  <h1 class="view-title">Verificación de certificado</h1>
  <p class="view-sub">Escribe el folio tal como aparece en el documento (ej. OP-2026-A1B2C3) o escanea el QR del certificado.</p>

  <div class="form-card" style="margin:20px auto">
    <label for="vf-folio">Folio del certificado</label>
    <input id="vf-folio" placeholder="OP-2026-XXXXXX" style="text-transform:uppercase;font-family:var(--font-display);font-size:22px;letter-spacing:.1em;text-align:center">
    <button class="btn btn-green btn-block" id="vf-btn" style="margin-top:16px">Verificar</button>
    <div class="verify-result" id="vf-result"></div>
  </div>
</div>

<hr class="lane">
<footer>
  <div class="container">OperadorPro · La verificación consulta directamente nuestro registro de certificados emitidos.</div>
</footer>

<script src="js/verificar.js"></script>
</body>
</html>
