name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sintaxis de funciones Netlify
        run: npm run check:syntax

      - name: Contratos RPC (JS admin.rpc(...) vs schema_fleet.sql)
        run: npm run check:rpc

      - name: Pruebas de dominio
        run: npm test
